name: Build verified ForceFocus v16 APK

on:
  workflow_dispatch:
  push:
    branches: [main, forcefocus-v16-original-ui]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify accepted v16 UI before build
        shell: bash
        run: |
          echo "05eb065e5db421f28fa1db720764e2efed0b9bb1eebcf3f74e1838851f9b5f2f  app/src/main/assets/ForceFocus_v16.html" | sha256sum -c -
          test "$(find app/src/main/assets -maxdepth 1 -name '*.html' -printf '%f\n')" = "ForceFocus_v16.html"
          grep -F 'webView.loadUrl(UI_URL)' app/src/main/java/com/forcefocus/app/MainActivity.java
          grep -F 'file:///android_asset/ForceFocus_v16.html' app/src/main/java/com/forcefocus/app/MainActivity.java

      - name: Lint and compile installable APK
        run: gradle --no-daemon clean lintDebug assembleDebug

      - name: Verify packaged UI and Android components
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test "$(unzip -p "$APK" assets/ForceFocus_v16.html | sha256sum | awk '{print $1}')" = "05eb065e5db421f28fa1db720764e2efed0b9bb1eebcf3f74e1838851f9b5f2f"
          unzip -l "$APK" | grep -F 'assets/native-bridge.js'
          unzip -l "$APK" | grep -F 'assets/1000047052.png'
          unzip -l "$APK" | grep -F 'assets/1000047053.png'
          unzip -l "$APK" | grep -F 'assets/1000047065.png'
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F 'FocusAccessibilityService'
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F 'BootReceiver'
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F 'SCHEDULE_EXACT_ALARM'

      - name: Name final APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk 'dist/ForceFocus_v16_原样UI_正式版.apk'
          sha256sum 'dist/ForceFocus_v16_原样UI_正式版.apk'

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: ForceFocus_v16_原样UI_正式版
          path: dist/ForceFocus_v16_原样UI_正式版.apk
          if-no-files-found: error
          retention-days: 30
